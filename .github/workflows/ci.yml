name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip -e ".[test]"

      - name: Test
        run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install build check-wheel-contents twine
          python -m build
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Test installed distribution outside checkout
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          python -m venv "$RUNNER_TEMP/package-env"
          package_python="$RUNNER_TEMP/package-env/bin/python"
          if [ "$DISTRIBUTION" = wheel ]; then
            "$package_python" -m pip install dist/*.whl pytest
          else
            "$package_python" -m pip install dist/*.tar.gz pytest
          fi
          cp -R tests "$RUNNER_TEMP/package-tests"
          cd "$RUNNER_TEMP"
          "$package_python" -c "import pathlib, sysconfig, gmeterpy; assert pathlib.Path(gmeterpy.__file__).is_relative_to(sysconfig.get_path('purelib')); assert gmeterpy.__version__ not in ('0.0.0', '0+unknown'); print(gmeterpy.__version__)"
          "$package_python" -m pytest package-tests -q -o addopts=
          for command in gabl gphone loop scx2 vgfit; do
            "$RUNNER_TEMP/package-env/bin/$command" --help
          done
